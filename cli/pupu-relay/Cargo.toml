[package]
name = "pupu-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.12"
log = "0.4.33"
env_logger = "0.11.11"
tokio = { version = "1.52.3", features = [
    "parking_lot",
    "macros",
    "rt-multi-thread",
    "fs",
    "signal",
] }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
iroh-relay = { version = "1.0.1", default-features = false, features = [
    "server",
] }
rustls = { version = "0.23.41", default-features = false }
