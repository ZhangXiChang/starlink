[package]
name = "person-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.12"
log = "0.4.29"
n0-error = "0.1.3"
iroh = { version = "0.98.2", default-features = false, features = ["tls-ring"] }
rkyv = "0.8.16"
serde = { version = "1.0.228", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
futures = "0.3.32"
async-channel = "2.5.0"
