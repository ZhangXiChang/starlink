[package]
name = "endpoint"
version = "0.1.0"
edition = "2024"

[dependencies]
utils = { path = "../utils" }
person-protocol = { path = "../person-protocol" }

eyre = "0.6.12"
serde = { version = "1.0.228", features = ["derive"] }
iroh = "1.0.1"
iroh-gossip = "0.101.0"
iroh-relay = { version = "1.0.1", default-features = false }
async-channel = "2.5.0"
futures-lite = "2.6.1"
sharded-slab = "0.1.7"
parking_lot = "0.12.5"
base64 = "0.22.1"
serde_json = "1.0.150"
rand = "0.10.2"

[target.'cfg(target_family = "wasm")'.dependencies]
iroh-blobs = { version = "0.103.0", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
iroh-blobs = "0.103.0"
iroh-mainline-address-lookup = "0.4.0"
iroh-mdns-address-lookup = "0.4.0"
