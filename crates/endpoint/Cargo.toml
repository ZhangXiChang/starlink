[package]
name = "endpoint"
version = "0.1.0"
edition = "2024"

[dependencies]
utils = { path = "../utils" }
person-protocol = { path = "../person-protocol" }

eyre = "0.6.12"
serde = { version = "1.0.228", features = ["derive"] }
iroh-relay = { version = "0.98.0", default-features = false }
async-channel = "2.5.0"
futures-lite = "2.6.1"
sharded-slab = "0.1.7"
parking_lot = "0.12.5"
base64 = "0.22.1"
serde_json = "1.0.149"
rand = "0.10.1"

[target.'cfg(target_family = "wasm")'.dependencies]
iroh = { version = "0.98.2", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "0.98.0", default-features = false, features = [
    "net",
] }
iroh-blobs = { version = "0.100.0", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
iroh = { version = "0.98.2", features = [
    "address-lookup-mdns",
    "address-lookup-pkarr-dht",
] }
iroh-gossip = "0.98.0"
iroh-blobs = "0.100.0"
